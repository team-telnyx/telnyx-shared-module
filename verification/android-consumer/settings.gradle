pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
dependencyResolutionManagement {
    repositories {
        google()
        mavenCentral()
        maven {
            url = uri(System.getenv('KMP_MAVEN_REPO') ?: 'https://jitpack.io')
            content { includeGroup 'com.github.team-telnyx.telnyx-webrtc-kmp-binaries' }
        }
    }
}
rootProject.name = 'android-binary-consumer'
