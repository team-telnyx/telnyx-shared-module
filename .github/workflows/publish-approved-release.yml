name: publish-approved-release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Validate only; publication requires separate explicit approval
        type: boolean
        default: true
        required: true
      version:
        description: Approved semantic version without a v prefix
        required: true
      source_run_id:
        description: Successful KMP packaging workflow run ID
        required: true
      source_commit:
        description: Full source commit SHA expected in artifacts.json
        required: true

permissions:
  contents: read
  actions: read

jobs:
  validate:
    runs-on: macos-latest
    env:
      VERSION: ${{ inputs.version }}
      SOURCE_RUN_ID: ${{ inputs.source_run_id }}
      SOURCE_COMMIT: ${{ inputs.source_commit }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validate inputs
        run: |
          python3 - <<'PYCODE'
          import os, re
          assert re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+", os.environ["VERSION"])
          assert re.fullmatch(r"[0-9]+", os.environ["SOURCE_RUN_ID"])
          assert re.fullmatch(r"[0-9a-f]{40}", os.environ["SOURCE_COMMIT"])
          PYCODE
      - name: Create source artifact read token
        id: source-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ secrets.KMP_SOURCE_APP_ID || vars.KMP_SOURCE_APP_ID }}
          private-key: ${{ secrets.KMP_SOURCE_APP_PRIVATE_KEY }}
          owner: team-telnyx
          repositories: telnyx-webrtc-kmp-shared-module
          permission-actions: read
      - name: Download artifacts from the private source workflow
        env:
          GH_TOKEN: ${{ steps.source-token.outputs.token }}
        run: |
          test -n "$GH_TOKEN" || { echo "GitHub App source artifact token was not generated"; exit 1; }
          gh run view "$SOURCE_RUN_ID" --repo team-telnyx/telnyx-webrtc-kmp-shared-module \
            --json conclusion,headSha,workflowName > run.json
          python3 - <<'PYCODE'
          import json, os
          run = json.load(open("run.json"))
          assert run["conclusion"] == "success"
          assert run["headSha"] == os.environ["SOURCE_COMMIT"]
          assert run["workflowName"] == "package-release-candidate"
          PYCODE
          mkdir -p incoming
          gh run download "$SOURCE_RUN_ID" \
            --repo team-telnyx/telnyx-webrtc-kmp-shared-module \
            --name kmp-release-candidate \
            --dir incoming
      - name: Validate manifest and provenance
        run: |
          scripts/validate-artifacts.sh incoming
          python3 - <<'PY'
          import json, os
          manifest = json.load(open("incoming/artifacts.json"))
          assert manifest["version"] == os.environ["VERSION"]
          assert manifest["source_commit"] == os.environ["SOURCE_COMMIT"]
          PY
      - name: Materialize the immutable Swift package manifest
        env:
          VERSION: ${{ inputs.version }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          version = os.environ["VERSION"]
          manifest = json.loads(Path("incoming/artifacts.json").read_text())
          checksum = manifest["swiftpm_checksum"]
          asset = f"TelnyxObservability-{version}.xcframework.zip"
          package = f'''// swift-tools-version: 5.7
          import PackageDescription

          let package = Package(
              name: "TelnyxWebRTCKMPBinaries",
              platforms: [.iOS(.v12)],
              products: [
                  .library(
                      name: "TelnyxObservability",
                      targets: ["TelnyxObservability"]
                  )
              ],
              targets: [
                  .binaryTarget(
                      name: "TelnyxObservability",
                      url: "https://github.com/team-telnyx/telnyx-webrtc-kmp-binaries/releases/download/{version}/{asset}",
                      checksum: "{checksum}"
                  )
              ]
          )
          '''
          Path("Package.swift").write_text(package)
          PY
          swift package dump-package >/dev/null
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install Android downloader dependencies
        run: python3 -m pip install -r scripts/requirements.txt
      - name: Validate complete Android publication locally
        run: |
          if test -f "incoming/telnyx-observability-android-$VERSION.zip"; then
            python3 scripts/prepare-android.py --candidate-dir incoming
            ./gradlew publishToMavenLocal -Pversion="$VERSION"
          fi
      - name: Dry-run result
        run: echo "Candidate verified; no files committed, uploaded, tagged or released."

  publish:
    if: ${{ !inputs.dry_run }}
    needs: validate
    runs-on: macos-latest
    environment: binary-release
    permissions:
      contents: write
      actions: read
    env:
      VERSION: ${{ inputs.version }}
      SOURCE_RUN_ID: ${{ inputs.source_run_id }}
      SOURCE_COMMIT: ${{ inputs.source_commit }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validate inputs
        run: |
          python3 - <<'PYCODE'
          import os, re
          assert re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+", os.environ["VERSION"])
          assert re.fullmatch(r"[0-9]+", os.environ["SOURCE_RUN_ID"])
          assert re.fullmatch(r"[0-9a-f]{40}", os.environ["SOURCE_COMMIT"])
          PYCODE
      - name: Create source artifact read token
        id: source-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ secrets.KMP_SOURCE_APP_ID || vars.KMP_SOURCE_APP_ID }}
          private-key: ${{ secrets.KMP_SOURCE_APP_PRIVATE_KEY }}
          owner: team-telnyx
          repositories: telnyx-webrtc-kmp-shared-module
          permission-actions: read
      - name: Download artifacts from the private source workflow
        env:
          GH_TOKEN: ${{ steps.source-token.outputs.token }}
        run: |
          test -n "$GH_TOKEN" || { echo "GitHub App source artifact token was not generated"; exit 1; }
          gh run view "$SOURCE_RUN_ID" --repo team-telnyx/telnyx-webrtc-kmp-shared-module \
            --json conclusion,headSha,workflowName > run.json
          python3 - <<'PYCODE'
          import json, os
          run = json.load(open("run.json"))
          assert run["conclusion"] == "success"
          assert run["headSha"] == os.environ["SOURCE_COMMIT"]
          assert run["workflowName"] == "package-release-candidate"
          PYCODE
          mkdir -p incoming
          gh run download "$SOURCE_RUN_ID" \
            --repo team-telnyx/telnyx-webrtc-kmp-shared-module \
            --name kmp-release-candidate \
            --dir incoming
      - name: Validate manifest and provenance
        run: |
          scripts/validate-artifacts.sh incoming
          python3 - <<'PY'
          import json, os
          manifest = json.load(open("incoming/artifacts.json"))
          assert manifest["version"] == os.environ["VERSION"]
          assert manifest["source_commit"] == os.environ["SOURCE_COMMIT"]
          PY
      - name: Materialize the immutable Swift package manifest
        env:
          VERSION: ${{ inputs.version }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          version = os.environ["VERSION"]
          manifest = json.loads(Path("incoming/artifacts.json").read_text())
          checksum = manifest["swiftpm_checksum"]
          asset = f"TelnyxObservability-{version}.xcframework.zip"
          package = f'''// swift-tools-version: 5.7
          import PackageDescription

          let package = Package(
              name: "TelnyxWebRTCKMPBinaries",
              platforms: [.iOS(.v12)],
              products: [
                  .library(
                      name: "TelnyxObservability",
                      targets: ["TelnyxObservability"]
                  )
              ],
              targets: [
                  .binaryTarget(
                      name: "TelnyxObservability",
                      url: "https://github.com/team-telnyx/telnyx-webrtc-kmp-binaries/releases/download/{version}/{asset}",
                      checksum: "{checksum}"
                  )
              ]
          )
          '''
          Path("Package.swift").write_text(package)
          PY
          swift package dump-package >/dev/null
      - name: Pin Android publication for this immutable release
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          manifest = json.loads(Path("incoming/artifacts.json").read_text())
          name = f"telnyx-observability-android-{os.environ['VERSION']}.zip"
          asset = next(a for a in manifest["artifacts"] if a["name"] == name)
          Path("android-release.json").write_text(json.dumps({
              "version": manifest["version"], "source_commit": manifest["source_commit"],
              "sha256": asset["sha256"]
          }, indent=2) + "\n")
          PY
      - name: Require configured release reviewers and unused version
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLIC_REPO: ${{ github.repository }}
        run: |
          gh api "repos/$PUBLIC_REPO/environments/binary-release" > environment.json
          python3 - <<'PYCODE'
          import json
          env = json.load(open("environment.json"))
          assert any(r["type"] == "required_reviewers" and r.get("reviewers") for r in env["protection_rules"]), "Configure required release reviewers first"
          PYCODE
          gh api --paginate "repos/$PUBLIC_REPO/tags" --jq '.[].name' > tags.txt
          gh api --paginate "repos/$PUBLIC_REPO/releases" --jq '.[].tag_name' > releases.txt
          if grep -Fxq -- "$VERSION" tags.txt || grep -Fxq -- "$VERSION" releases.txt; then
            echo "Version already exists; refusing overwrite"
            exit 1
          fi
      - name: Commit and tag package manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Package.swift android-release.json
          git commit -m "Publish KMP binaries $VERSION"
          git tag "$VERSION"
          # Publish the versioned manifest only through its immutable tag.
          # main is PR-protected; never combine a main push and tag push.
          git push origin "refs/tags/$VERSION"
      - name: Publish immutable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$VERSION" incoming/* --verify-tag \
            --title "KMP binaries $VERSION" \
            --notes "Built from private source commit $SOURCE_COMMIT."
